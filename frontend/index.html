<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Regulierungs-Assistent</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-text">
                    <h1>Regulierungs-Assistent</h1>
                    <p class="subtitle">Fragen zu Bankenregulierung, BaFin-Vorschriften und Compliance</p>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Farbschema wechseln">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Sidebar -->
            <aside class="sidebar">
                <!-- New Chat Button -->
                <div class="sidebar-section">
                    <button id="newChatButton" class="new-chat-button">+ NEUER CHAT</button>
                </div>

                <!-- Dokument Stats -->
                <div class="sidebar-section">
                    <details class="stats-collapsible">
                        <summary class="stats-header">Regulierungsdokumente</summary>
                        <div class="course-stats" id="courseStats">
                            <div class="stat-item">
                                <span class="stat-label">Anzahl der Dokumente:</span>
                                <span class="stat-value" id="totalDokumente">-</span>
                            </div>
                            <div class="stat-item">
                                <div class="course-titles" id="dokumentTitel">
                                    <span class="loading">Laden...</span>
                                </div>
                            </div>
                        </div>
                    </details>
                </div>

                <!-- Suggested Questions -->
                <div class="sidebar-section">
                    <details class="suggested-collapsible">
                        <summary class="suggested-header">Fragen Sie zum Beispiel:</summary>
                        <div class="suggested-items">
                            <button class="suggested-item" data-question="Was sind die Kernpflichten nach MaRisk AT 4.3 zur Risikosteuerung?">MaRisk AT 4.3 Anforderungen</button>
                            <button class="suggested-item" data-question="Welche IT-Sicherheitsanforderungen stellt die BAIT an Kreditinstitute?">BAIT IT-Sicherheitsanforderungen</button>
                            <button class="suggested-item" data-question="Welche Sorgfaltspflichten gelten nach den BaFin-Hinweisen zur Geldwäscheprävention?">AML-Sorgfaltspflichten</button>
                            <button class="suggested-item" data-question="Was ist die Struktur des MaRisk-Rundschreibens?">Struktur eines Dokuments</button>
                        </div>
                    </details>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="chat-main">
                <div class="chat-container">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-container">
                        <input
                            type="text"
                            id="chatInput"
                            placeholder="Fragen Sie zu BaFin-Vorschriften, MaRisk oder Compliance..."
                            autocomplete="off"
                        >
                        <button id="sendButton">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
